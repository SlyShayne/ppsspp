# Replacements for the game's own screen while this pack runs (GungnirHost, PPSSPP texture pack format).
# title_text.png is built from your own dump by gungnir/tools/p3p_assets.py.
[options]
version = 1
hash = quick

[hashes]
# The title's text atlas, with everything but the copyright line made transparent: PRESS ANY BUTTON,
# the menu items and the menu's highlight are on the second screen instead.
09413270a4a5585354d8cad1 = title_text.png
# The name keyboard's frame, font atlas and cursor ball, made transparent: the keyboard is on the second screen
